spring.application.name=teachtrack

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/teachtrack_db?serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=sunil

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
